<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/music-embed.css">
</head>
<body>
    <div class="player music-container">
        <div class="cover img-container">
            <img src="" alt="cover" id="cover">
        </div>
        <div class="info music-info">
            <h4 id="title"></h4>
            <p id="description"></p>
        </div>
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <div class="progress"></div>
            <span id="duration">0:00</span>
        </div>
        <audio src="" id="audio"></audio>
        <div class="navigation">
            <button id="prev" class="action-btn" aria-label="Previous track"><i class="fas fa-backward" aria-hidden="true"></i></button>
            <button id="play" class="action-btn action-btn-big" aria-label="Play"><i class="fas fa-play" aria-hidden="true"></i></button>
            <button id="next" class="action-btn" aria-label="Next track"><i class="fas fa-forward" aria-hidden="true"></i></button>
        </div>
    </div>
    <script src="js/music-player.js"></script>
</body>
</html>
