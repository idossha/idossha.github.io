<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Records · Ido Haber</title>
  <link rel="icon" type="image/png" href="/assets/misc/favicon.png" />
  <link rel="stylesheet" href="/styling/common.css"/>
  <link rel="stylesheet" href="/styling/records.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link rel="stylesheet" href="media.css">
</head>
<body>
  <nav class="top">
    <span class="name"><a href="index.html">Ido Haber</a></span>
    <span class="links">
      <a href="index.html">Home</a>
      <a href="index.html?panel=music">Music</a>
      <span id="record-count" style="color:var(--muted)"></span>
    </span>
  </nav>

  <div class="page-head">
    <h1>Records</h1>
    <div class="sub">My vinyl collection.</div>
  </div>

  <div class="search-bar-container" style="max-width:900px;margin:0 auto 1.5rem;padding:0 1.5rem;position:relative;">
    <input type="text" id="search-bar" placeholder="Search…" style="padding:10px;width:220px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);"/>
    <ul id="suggestions" style="list-style:none;padding:0;margin:0;background:var(--bg);border:1px solid var(--line);position:absolute;width:220px;display:none;z-index:1000;"></ul>
  </div>

  <section id="collection-grid" class="collection-grid"></section>

  <div id="modal-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:998;"></div>
  <div id="record-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--bg);color:var(--fg);padding:20px;border:1px solid var(--line);z-index:999;min-width:300px;border-radius:8px;">
    <button id="close-modal" style="position:absolute;top:5px;right:5px;background:none;border:none;font-size:16px;cursor:pointer;color:var(--fg);">X</button>
    <div id="modal-content"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.1/papaparse.min.js"></script>
  <script src="/functionality/records.js"></script>
  <script src="/functionality/records_search.js"></script>
</body>
</html>
