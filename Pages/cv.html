<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <link rel="stylesheet" href="../styling/common.css">
    <link rel="stylesheet" href="../styling/project_page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-724NR57445"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-724NR57445');
    </script>
</head>
<body class="project-page">
    <main class="project-container">
        <article class="project-card">
            <div class="page-lede-top">
                <div>
                    <h1 class="project-title">Resume</h1>
                    <p class="project-subtitle">
                        <a href="../assets/projects/cv/resume_July2026.pdf" download>Download PDF ↓</a>
                    </p>
                </div>
                <a href="../index.html" class="home-button" aria-label="Back to homepage">
                    <i class="fas fa-home" aria-hidden="true"></i>
                </a>
            </div>

            <div class="container">
                <div id="resume" class="markdown-body project-span-all">
                    <p>Loading…</p>
                </div>
            </div>
        </article>
    </main>

    <script>
      (async function () {
        const el = document.getElementById("resume");
        try {
          const md = await fetch("../assets/projects/cv/resume.md").then(r => {
            if (!r.ok) throw 0;
            return r.text();
          });
          el.innerHTML = marked.parse(md);
        } catch (e) {
          el.innerHTML = '<p>Couldn’t load the resume. ' +
            '<a href="../assets/projects/cv/resume_July2026.pdf">Open the PDF instead.</a></p>';
        }
      })();
    </script>
</body>
</html>
