<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading… · Ido Haber</title>
  <link rel="icon" type="image/png" href="/assets/misc/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <main class="wrap wide">
    <nav class="top">
      <span class="name"><a href="index.html" style="border:none;color:inherit;">Ido Haber</a></span>
      <span class="links">
        <a href="index.html">Home</a>
        <a href="blog.html">Writing</a>
        <a href="cv.html">CV</a>
      </span>
    </nav>

    <a class="back" href="blog.html">← Writing</a>

    <article id="post"><p class="lead">Loading…</p></article>

    <footer>© 2026 Ido Haber</footer>
  </main>

  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const slug = (params.get("slug") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
      const el = document.getElementById("post");
      if (!slug) { el.innerHTML = "<p class='lead'>Post not found.</p>"; return; }

      try {
        const [meta, md] = await Promise.all([
          fetch("posts/posts.json").then(r => r.json()),
          fetch("posts/" + slug + ".md").then(r => { if (!r.ok) throw 0; return r.text(); })
        ]);
        const info = meta.find(p => p.slug === slug) || {};
        const html = marked.parse(md);
        // Pull the first <h1> out of the rendered body and pair it with the date.
        const tmp = document.createElement("div");
        tmp.innerHTML = html;
        const h1 = tmp.querySelector("h1");
        const title = h1 ? h1.outerHTML : "";
        if (h1) h1.remove();
        el.innerHTML =
          title +
          (info.date ? '<div class="meta">' + info.date + "</div>" : "") +
          tmp.innerHTML;
        if (info.title) document.title = info.title + " · Ido Haber";
      } catch (e) {
        el.innerHTML = "<p class='lead'>Couldn't load this post.</p>";
      }
    })();
  </script>
</body>
</html>
